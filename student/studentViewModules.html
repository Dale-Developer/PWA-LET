<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Mathematics - Learning Modules | LearnIQ</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/styles/studentStyles/studentViewModules.css" />
  <!-- Sidebar CSS -->
  <link rel="stylesheet" href="../assets/styles/studentStyles/studentSidebar.css" />

  <!-- View Module Page Styles - with proper dashboard override -->
  
</head>
<body>
  <!-- HAMBURGER BUTTON -->
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open sidebar">
    <i class="fa-solid fa-bars"></i>
  </button>

  <!-- OVERLAY (for mobile sidebar) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- REUSABLE SIDEBAR (loaded by student-layout.js) -->
  <div id="sidebar-container"></div>

  <!-- DASHBOARD LAYOUT -->
  <div class="dashboard">
    <!-- MAIN CONTENT -->
    <div class="main-content">
      <!-- REUSABLE TOPBAR (loaded by student-layout.js) -->
      <div id="topbar-container"></div>

      <!-- VIEW MODULE PAGE CONTENT -->
      <div class="fade-in">
        <!-- Back Button -->
        <button class="back-link" id="backToModulesBtn">
          <i class="fa-solid fa-arrow-left"></i> Back to Modules
        </button>

        <!-- Breadcrumb -->
        <div class="breadcrumb">
          <span>General Education</span>
          <i class="fa-solid fa-chevron-right"></i>
          <span class="active">Mathematics</span>
        </div>

        <!-- Page Header -->
        <div class="page-header">
          <h1>Mathematics</h1>
          <p>Complete learning resources for Mathematics - Algebra, Calculus, Statistics</p>
        </div>

        <!-- Stats Summary Cards -->
        <div class="stats-summary">
          <div class="stat-card-mini">
            <div class="stat-icon-mini"><i class="fa-solid fa-clipboard-list"></i></div>
            <div class="stat-info-mini">
              <h4 id="quizCount">4</h4>
              <p>Quizzes Available</p>
            </div>
          </div>
          <div class="stat-card-mini">
            <div class="stat-icon-mini"><i class="fa-solid fa-book-open"></i></div>
            <div class="stat-info-mini">
              <h4 id="moduleCount">8</h4>
              <p>Learning Modules</p>
            </div>
          </div>
          <div class="stat-card-mini">
            <div class="stat-icon-mini"><i class="fa-regular fa-clock"></i></div>
            <div class="stat-info-mini">
              <h4>45 min</h4>
              <p>Est. Study Time</p>
            </div>
          </div>
        </div>

        <!-- Search Section -->
        <div class="search-section">
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="search-input" id="searchModulesInput" placeholder="Search modules, quizzes, or topics...">
          </div>
        </div>

        <!-- Upcoming Quizzes Section -->
        <div class="section-title-module">
          <i class="fa-solid fa-clipboard-question"></i>
          Upcoming Quizzes
        </div>
        <div class="quizzes-grid" id="quizzesContainer"></div>

        <!-- Learning Modules Section -->
        <div class="section-title-module">
          <i class="fa-solid fa-book"></i>
          Learning Modules
        </div>
        <div class="modules-list" id="modulesContainer"></div>

        <!-- Category Footer Badges -->
        <div class="category-footer">
          <span class="category-badge-footer">General Education</span>
          <span class="category-badge-footer">Professional Education</span>
          <span class="category-badge-footer">Major/Specialization</span>
        </div>
      </div>
    </div>
  </div>

  <!-- REUSABLE LAYOUT SCRIPT (loads sidebar and topbar dynamically) -->
  <script src="../assets/scripts/student-layout.js"></script>

  <!-- Page Data and Interactions -->
  <script>
    // Mathematics subject data
    const mathematicsData = {
      quizzes: [
        { id: 1, title: 'Quiz 1: Data Analysis', type: '📄 Incorrect to Algebra', date: '04/25/2025', duration: '20 min', questions: 15 },
        { id: 2, title: 'Quiz 2: Calculus Basics', type: '📄 Linear Equation', date: '04/25/2025', duration: '15 min', questions: 12 },
        { id: 3, title: 'Quiz 3: Quadratic Functions', type: '📄 Quadratic Equations', date: '04/25/2025', duration: '15 min', questions: 10 },
        { id: 4, title: 'Quiz 4: Trigonometric Identities', type: '📄 Trigonometry', date: '04/28/2025', duration: '30 min', questions: 20 }
      ],
      modules: [
        { id: 1, title: 'Introduction to Algebra', type: 'PDF Document', size: '2.4 MB', date: '04/05/2025', icon: 'fa-file-pdf', color: '#ef4444' },
        { id: 2, title: 'Linear Equations and Inequalities', type: 'PDF Document', size: '1.8 MB', date: '04/05/2025', icon: 'fa-file-pdf', color: '#ef4444' },
        { id: 3, title: 'Quadratic Equations', type: 'PDF Document', size: '3.1 MB', date: '04/05/2025', icon: 'fa-file-pdf', color: '#ef4444' },
        { id: 4, title: 'Functions and Their Graphs', type: 'PDF Document', size: '2.2 MB', date: '04/06/2025', icon: 'fa-file-pdf', color: '#ef4444' },
        { id: 5, title: 'Polynomials and Rational Functions', type: 'Interactive LMS', size: '-', date: '04/07/2025', icon: 'fa-chalkboard-user', color: '#4f46e5' },
        { id: 6, title: 'Exponential and Logarithmic Functions', type: 'PDF Document', size: '1.9 MB', date: '04/08/2025', icon: 'fa-file-pdf', color: '#ef4444' },
        { id: 7, title: 'Trigonometry Basics', type: 'Video Lecture', size: '45 min', date: '04/09/2025', icon: 'fa-video', color: '#10b981' },
        { id: 8, title: 'Calculus: Limits and Derivatives', type: 'PDF Document', size: '3.5 MB', date: '04/10/2025', icon: 'fa-file-pdf', color: '#ef4444' }
      ]
    };

    // DOM Elements
    const quizzesContainer = document.getElementById('quizzesContainer');
    const modulesContainer = document.getElementById('modulesContainer');
    const searchInput = document.getElementById('searchModulesInput');
    const backBtn = document.getElementById('backToModulesBtn');
    const quizCountSpan = document.getElementById('quizCount');
    const moduleCountSpan = document.getElementById('moduleCount');

    // Update counts
    if (quizCountSpan) quizCountSpan.textContent = mathematicsData.quizzes.length;
    if (moduleCountSpan) moduleCountSpan.textContent = mathematicsData.modules.length;

    // Helper: Escape HTML
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Render Quizzes
    function renderQuizzes(filterText = '') {
      if (!quizzesContainer) return;
      
      const filtered = mathematicsData.quizzes.filter(q => 
        q.title.toLowerCase().includes(filterText.toLowerCase())
      );
      
      if (filtered.length === 0) {
        quizzesContainer.innerHTML = `<div class="empty-state-module" style="grid-column: 1/-1;"><i class="fa-regular fa-clipboard"></i><p>No quizzes match your search</p></div>`;
        return;
      }
      
      quizzesContainer.innerHTML = filtered.map(q => `
        <div class="quiz-card" data-quiz-id="${q.id}">
          <div class="quiz-info">
            <div class="quiz-title">${escapeHtml(q.title)}</div>
            <div class="quiz-meta">
              <span class="quiz-type"><i class="fa-regular fa-file-lines"></i> ${escapeHtml(q.type)}</span>
              <span class="quiz-date"><i class="fa-regular fa-calendar"></i> ${q.date}</span>
              <span><i class="fa-regular fa-clock"></i> ${q.duration}</span>
            </div>
          </div>
          <button class="open-quiz-btn" data-quiz-title="${escapeHtml(q.title)}">
            <i class="fa-regular fa-play"></i> Take Quiz
          </button>
        </div>
      `).join('');
      
      // Attach quiz button handlers
      document.querySelectorAll('.open-quiz-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const title = btn.getAttribute('data-quiz-title');
          alert(`Starting Quiz: ${title}\n\nThis would open the quiz interface.`);
        });
      });
    }

    // Render Learning Modules
    function renderModules(filterText = '') {
      if (!modulesContainer) return;
      
      const filtered = mathematicsData.modules.filter(m => 
        m.title.toLowerCase().includes(filterText.toLowerCase()) || 
        m.type.toLowerCase().includes(filterText.toLowerCase())
      );
      
      if (filtered.length === 0) {
        modulesContainer.innerHTML = `<div class="empty-state-module"><i class="fa-regular fa-folder-open"></i><p>No modules match your search</p></div>`;
        return;
      }
      
      modulesContainer.innerHTML = filtered.map(m => `
        <div class="module-item" data-module-id="${m.id}">
          <div class="module-info">
            <div class="module-icon" style="background: ${m.color}10; color: ${m.color}">
              <i class="fa-solid ${m.icon}"></i>
            </div>
            <div class="module-details">
              <h4>${escapeHtml(m.title)}</h4>
              <p>
                <span class="module-badge"><i class="fa-regular ${m.icon === 'fa-file-pdf' ? 'fa-file-pdf' : m.icon === 'fa-chalkboard-user' ? 'fa-chalkboard-user' : 'fa-video'}"></i> ${escapeHtml(m.type)}</span>
                <span><i class="fa-regular fa-calendar"></i> ${m.date}</span>
                <span><i class="fa-regular fa-hard-drive"></i> ${m.size}</span>
              </p>
            </div>
          </div>
          <button class="open-module-btn" data-module-title="${escapeHtml(m.title)}" data-module-type="${m.type}">
            <i class="fa-regular fa-eye"></i> View Module
          </button>
        </div>
      `).join('');
      
      // Attach module button handlers
      document.querySelectorAll('.open-module-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const title = btn.getAttribute('data-module-title');
          const type = btn.getAttribute('data-module-type');
          alert(`Opening: ${title}\nType: ${type}\n\nThis would open the module content (PDF/LMS/Video).`);
        });
      });
    }

    // Search handler
    function handleSearch() {
      const searchTerm = searchInput?.value || '';
      renderQuizzes(searchTerm);
      renderModules(searchTerm);
    }

    // Back to modules page
    function goBackToModules() {
      if (document.referrer && (document.referrer.includes('studentModule.html') || document.referrer.includes('student-modules'))) {
        window.history.back();
      } else {
        window.location.href = 'studentModules.html';
      }
    }

    // Initialize page
    document.addEventListener('DOMContentLoaded', () => {
      renderQuizzes();
      renderModules();
      
      if (searchInput) {
        searchInput.addEventListener('input', handleSearch);
      }
      
      if (backBtn) {
        backBtn.addEventListener('click', goBackToModules);
      }
      
      // Highlight Modules in sidebar after it loads
      setTimeout(() => {
        const sidebar = document.querySelector('#sidebar-container .sidebar, #sidebar-container');
        if (sidebar) {
          const modulesLink = Array.from(sidebar.querySelectorAll('.menu-item')).find(item => 
            item.textContent.toLowerCase().includes('modules')
          );
          if (modulesLink) {
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            modulesLink.classList.add('active');
          }
        }
      }, 150);
    });
  </script>
</body>
</html>
