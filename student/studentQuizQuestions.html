<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Quiz Questions - LearnIQ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<!-- Reusable sidebar + topbar styles -->
<link rel="stylesheet" href="../assets/styles/studentStyles/studentSidebar.css" />

<style>
  /* ── Fade transition ── */
  body {
    opacity: 1;
    transition: opacity 0.15s ease-in-out;
  }
  body.page-loading { opacity: 0; }

  /* Same dashboard flex override as studentQuiz.html */
  .dashboard {
    display: flex !important;
    grid-template-columns: unset !important;
    padding: 0 !important;
    gap: 0 !important;
  }

  .main-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* Topbar strip */
  .topbar-wrapper {
    background: #eef2ff;
    padding: 14px 28px;
    /* border-bottom: 1px solid #eef2ff; */
    flex-shrink: 0;
  }

  /* Scrollable page area */
  .page-body {
    flex: 1;
    overflow-y: auto;
    padding: 32px 28px 48px;
  }

  /* ══════════════════════════════════════
     BREADCRUMB / BACK LINK
  ══════════════════════════════════════ */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 500;
    color: #2446d8;
    cursor: pointer;
    margin-bottom: 18px;
    transition: opacity 0.2s;
  }
  .back-link:hover { opacity: 0.72; }

  /* ══════════════════════════════════════
     PAGE TITLE
  ══════════════════════════════════════ */
  .page-title {
    font-size: 28px;
    font-weight: 700;
    color: #2446d8;
    margin-bottom: 22px;
  }

  /* ══════════════════════════════════════
     PROGRESS
  ══════════════════════════════════════ */
  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .progress-row span {
    font-size: 13px;
    color: #6b7280;
    font-weight: 500;
  }
  .progress-row .pct { font-weight: 600; }

  .progress-track {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 26px;
  }
  .progress-fill {
    height: 100%;
    background: #2446d8;
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ══════════════════════════════════════
     QUESTION CARD
  ══════════════════════════════════════ */
  .question-card {
    background: #fff;
    border-radius: 16px;
    padding: 28px 30px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    margin-bottom: 16px;
  }

  .question-number {
    font-size: 14px;
    font-weight: 700;
    color: #2446d8;
    margin-bottom: 10px;
  }

  .question-text {
    font-size: 15px;
    color: #1f2937;
    font-weight: 500;
    line-height: 1.7;
    margin-bottom: 26px;
  }

  /* ── Options ── */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .option-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    cursor: pointer;
    background: #fff;
    transition: border-color 0.18s, background 0.18s;
  }
  .option-item:hover {
    border-color: #2446d8;
    background: #f5f7ff;
  }
  .option-item.selected {
    border-color: #2446d8;
    background: #eef1fd;
  }

  /* Radio circle */
  .option-radio {
    width: 20px;
    height: 20px;
    min-width: 20px;
    border-radius: 50%;
    border: 2px solid #d1d5db;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.18s, background 0.18s;
  }
  .option-item.selected .option-radio {
    border-color: #2446d8;
    background: #2446d8;
  }
  .radio-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    display: none;
  }
  .option-item.selected .radio-dot { display: block; }

  .option-letter {
    font-size: 14px;
    font-weight: 600;
    color: #374151;
    min-width: 20px;
    transition: color 0.18s;
  }
  .option-item.selected .option-letter { color: #2446d8; }

  .option-text {
    font-size: 14px;
    color: #374151;
    line-height: 1.5;
    transition: color 0.18s;
  }
  .option-item.selected .option-text { color: #2446d8; font-weight: 500; }

  /* ══════════════════════════════════════
     MARK FOR REVIEW
  ══════════════════════════════════════ */
  .mark-row { margin-bottom: 20px; }

  .mark-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: none;
    border: none;
    font-size: 13px;
    color: #6b7280;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    padding: 5px 0;
    transition: color 0.2s;
  }
  .mark-btn:hover  { color: #f59e0b; }
  .mark-btn.marked { color: #f59e0b; font-weight: 600; }
  .mark-btn i { font-size: 14px; }

  /* ══════════════════════════════════════
     NAVIGATION BUTTONS
  ══════════════════════════════════════ */
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 26px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    transition: all 0.2s ease;
  }

  .btn-prev {
    background: #fff;
    border: 1.5px solid #d1d5db;
    color: #374151;
  }
  .btn-prev:hover:not(:disabled) {
    border-color: #9ca3af;
    background: #f9fafb;
  }
  .btn-prev:disabled { opacity: 0.38; cursor: not-allowed; }

  .btn-next {
    background: #2446d8;
    border: none;
    color: #fff;
  }
  .btn-next:hover { background: #1a36b0; }

  .q-counter {
    font-size: 13px;
    color: #6b7280;
    font-weight: 500;
  }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    .page-body      { padding: 20px 16px 40px; }
    .topbar-wrapper { padding: 12px 16px; }
    .question-card  { padding: 20px; }
    .option-item    { padding: 11px 14px; }
    .nav-btn        { padding: 10px 18px; font-size: 13px; }
  }
</style>
</head>
<body class="page-loading">

<!-- Hamburger -->
<button class="hamburger-btn" id="hamburgerBtn" aria-label="Open sidebar">
  <i class="fa-solid fa-bars"></i>
</button>

<!-- Overlay + sidebar container -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div id="sidebar-container"></div>

<!-- Dashboard shell -->
<div class="dashboard">
  <div class="main-content">

    <!-- Topbar -->
    <div class="topbar-wrapper">
      <div id="topbar-container"></div>
    </div>

    <!-- Page content -->
    <div class="page-body">

      <!-- Back breadcrumb -->
      <div class="back-link" onclick="goBack()">
        <i class="fa-solid fa-chevron-left"></i>
        Quiz Mode
      </div>

      <!-- Category title (filled by JS from localStorage) -->
      <div class="page-title" id="pageTitle">General Education</div>

      <!-- Progress bar -->
      <div class="progress-row">
        <span id="progressLabel">Question 1 of 50</span>
        <span class="pct" id="progressPct">2%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 2%;"></div>
      </div>

      <!-- Question card -->
      <div class="question-card">
        <div class="question-number" id="qNumber">Question 1</div>
        <div class="question-text"  id="qText"></div>
        <div class="options-list"   id="optionsList"></div>
      </div>

      <!-- Mark for review -->
      <div class="mark-row">
        <button class="mark-btn" id="markBtn" onclick="toggleMark()">
          <i class="fa-regular fa-flag"></i>
          Mark for review
        </button>
      </div>

      <!-- Navigation -->
      <div class="nav-row">
        <button class="nav-btn btn-prev" id="prevBtn" onclick="prevQ()" disabled>
          <i class="fa-solid fa-chevron-left"></i> Previous
        </button>
        <span class="q-counter" id="qCounter">1 / 50</span>
        <button class="nav-btn btn-next" id="nextBtn" onclick="nextQ()">
          Next <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

    </div><!-- /page-body -->
  </div><!-- /main-content -->
</div><!-- /dashboard -->

<!-- Reusable layout (sidebar + topbar injection, active menu, collapse, mobile, logout) -->
<script src="../assets/scripts/student-layout.js"></script>

<script>
  // ── Sample question bank (cycle for demo; replace with real fetch) ──
  const QUESTIONS = [
    {
      q: "Which of the following is NOT a characteristic of object-oriented programming?",
      opts: ["Encapsulation", "Compilation", "Inheritance", "Polymorphism"]
    },
    {
      q: "What does CPU stand for?",
      opts: ["Central Processing Unit", "Computer Personal Unit", "Central Peripheral Unit", "Core Processing Utility"]
    },
    {
      q: "Which data structure operates on a LIFO principle?",
      opts: ["Queue", "Linked List", "Stack", "Tree"]
    },
    {
      q: "What is the time complexity of binary search?",
      opts: ["O(n)", "O(n²)", "O(log n)", "O(1)"]
    },
    {
      q: "Which of the following is a primary color in the RGB model?",
      opts: ["Yellow", "Cyan", "Green", "Magenta"]
    }
  ];

  const TOTAL      = 50;
  const LETTERS    = ["A", "B", "C", "D"];
  const answers    = new Array(TOTAL).fill(null);
  const markedList = new Array(TOTAL).fill(false);
  let   current    = 0;

  // Set category title from localStorage
  const cat = localStorage.getItem("selectedQuizCategory") || "General Education";
  document.getElementById("pageTitle").textContent = cat;

  renderQuestion();

  function renderQuestion() {
    const qData = QUESTIONS[current % QUESTIONS.length];
    const qNum  = current + 1;
    const pct   = Math.round((qNum / TOTAL) * 100);

    // Progress
    document.getElementById("progressLabel").textContent  = `Question ${qNum} of ${TOTAL}`;
    document.getElementById("progressPct").textContent    = `${pct}%`;
    document.getElementById("progressFill").style.width   = `${pct}%`;
    document.getElementById("qCounter").textContent       = `${qNum} / ${TOTAL}`;

    // Question
    document.getElementById("qNumber").textContent = `Question ${qNum}`;
    document.getElementById("qText").textContent   = qData.q;

    // Options
    const list = document.getElementById("optionsList");
    list.innerHTML = "";
    qData.opts.forEach((opt, i) => {
      const div = document.createElement("div");
      div.className = "option-item" + (answers[current] === i ? " selected" : "");
      div.onclick   = () => pickAnswer(i);
      div.innerHTML = `
        <div class="option-radio"><div class="radio-dot"></div></div>
        <span class="option-letter">${LETTERS[i]}.</span>
        <span class="option-text">${opt}</span>
      `;
      list.appendChild(div);
    });

    // Mark button
    const btn = document.getElementById("markBtn");
    if (markedList[current]) {
      btn.classList.add("marked");
      btn.innerHTML = `<i class="fa-solid fa-flag"></i> Marked for review`;
    } else {
      btn.classList.remove("marked");
      btn.innerHTML = `<i class="fa-regular fa-flag"></i> Mark for review`;
    }

    // Prev button
    document.getElementById("prevBtn").disabled = current === 0;

    // Next/Submit label
    const nextBtn = document.getElementById("nextBtn");
    if (current === TOTAL - 1) {
      nextBtn.innerHTML = `Submit <i class="fa-solid fa-check"></i>`;
    } else {
      nextBtn.innerHTML = `Next <i class="fa-solid fa-chevron-right"></i>`;
    }
  }

  function pickAnswer(index) {
    answers[current] = index;
    renderQuestion();
  }

  function prevQ() {
    if (current > 0) { current--; renderQuestion(); }
  }

  function nextQ() {
    if (current < TOTAL - 1) {
      current++;
      renderQuestion();
    } else {
      submitQuiz();
    }
  }

  function toggleMark() {
    markedList[current] = !markedList[current];
    renderQuestion();
  }

  function submitQuiz() {
    const done = answers.filter(a => a !== null).length;
    alert(`Quiz submitted!\nAnswered: ${done} / ${TOTAL}`);
    // Optionally redirect back to quiz mode page
    if (confirm("Return to Quiz Mode?")) {
      goBack();
    }
  }

  function goBack() {
    if (typeof window.navigateWithTransition === 'function') {
      window.navigateWithTransition('../student/studentQuiz.html');
    } else {
      window.location.href = '../student/studentQuiz.html';
    }
  }

  // ========== ACTIVE SIDEBAR HIGHLIGHTING ==========
  // This function ensures the "Quiz Mode" menu item is highlighted in the sidebar
  function highlightActiveSidebarItem() {
    // Wait a bit for the sidebar to load
    setTimeout(() => {
      const sidebar = document.querySelector('#sidebar-container .sidebar, #sidebar-container');
      if (sidebar) {
        // Find the menu item that contains "Quiz" or "Quiz Mode" text
        const allMenuItems = sidebar.querySelectorAll('.menu-item');
        let quizMenuItem = null;
        
        for (let item of allMenuItems) {
          const text = item.textContent.toLowerCase();
          if (text.includes('quiz') || text.includes('quiz mode')) {
            quizMenuItem = item;
            break;
          }
        }
        
        if (quizMenuItem) {
          // Remove active class from all menu items
          allMenuItems.forEach(item => item.classList.remove('active'));
          // Add active class to Quiz Mode item
          quizMenuItem.classList.add('active');
        }
      }
    }, 200); // Increased delay to ensure sidebar is fully loaded
  }

  // Also handle when sidebar might be injected after DOMContentLoaded
  document.addEventListener("DOMContentLoaded", function() {
    document.body.classList.remove("page-loading");
    highlightActiveSidebarItem();
    
    // Set up a mutation observer to watch for sidebar injection
    const observer = new MutationObserver(function(mutations) {
      const sidebarContainer = document.getElementById('sidebar-container');
      if (sidebarContainer && sidebarContainer.children.length > 0) {
        highlightActiveSidebarItem();
        observer.disconnect(); // Stop observing once sidebar is loaded
      }
    });
    
    observer.observe(document.getElementById('sidebar-container'), { childList: true, subtree: true });
  });
  
  // Fallback: highlight when window loads
  window.addEventListener('load', function() {
    highlightActiveSidebarItem();
  });
  
  // Export navigateWithTransition for compatibility
  window.navigateWithTransition = window.navigateWithTransition || function(url) {
    window.location.href = url;
  };
</script>
</body>
</html>
