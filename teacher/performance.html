<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LearnIQ Performance</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>
    <!-- Remix Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="../assets/styles/teacherStyles/sidebar.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --sidebar-width: 270px;
        --primary: #6d5dfc;
        --bg: #f5f7fb;
        --card-border: #edf0f5;
        --text-light: #64748b;
      }

      body {
        font-family: "Nunito", sans-serif;
        background: var(--bg);
        color: #1e293b;
        overflow-x: hidden;
      }

      /* =========================
         LAYOUT
      ========================== */

      .main {
        /* margin-left: var(--sidebar-width); */
        width: calc(100% - var(--sidebar-width));
        min-height: 100vh;
      }

      .content {
        padding: 24px;
      }

      #header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #fff;
        border-bottom: 1px solid #edf0f5;
      }

      /* =========================
         TABLE
      ========================== */

      .table-card {
        background: #fff;
        border-radius: 20px;
        border: 1px solid var(--card-border);
        overflow: hidden;
      }

      .table-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--card-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .card-title {
        font-size: 18px;
        font-weight: 800;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 14px;
        width: 280px;
      }

      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-family: inherit;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 1100px;
        border-collapse: collapse;
      }

      thead {
        background: #fafbfc;
      }

      th,
      td {
        padding: 18px 20px;
        text-align: left;
        font-size: 14px;
      }

      th {
        color: var(--text-light);
        font-weight: 700;
      }

      tbody tr {
        border-top: 1px solid #f1f5f9;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      tbody tr:hover {
        background: #fafcff;
      }

      .student {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #dbeafe;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }

      .green-text {
        color: #22c55e;
        font-weight: 700;
      }

      .red-text {
        color: #ef4444;
        font-weight: 700;
      }

      .badge {
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }

      .active {
        background: #dcfce7;
        color: #16a34a;
      }

      .inactive {
        background: #fee2e2;
        color: #dc2626;
      }

      .action-btns {
        display: flex;
        gap: 10px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        background: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .icon-btn:hover {
        background: #f8fafc;
      }

      .pagination {
        padding: 20px 24px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid #f1f5f9;
      }

      .page-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        background: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        color: #334155;
      }

      .page-btn.active-page {
        background: var(--primary);
        color: white;
        border: none;
      }

      /* =========================
         MODAL (STUDENT DETAIL)
      ========================== */

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 1.5rem;
        visibility: hidden;
        opacity: 0;
        transition: 0.25s ease;
      }

      .modal-overlay.active {
        visibility: visible;
        opacity: 1;
      }

      .modal-card {
        background: #ffffff;
        border-radius: 28px;
        max-width: 650px;
        width: 100%;
        padding: 2rem 2rem 1.8rem;
        box-shadow: 0 30px 50px rgba(0, 0, 0, 0.2);
        position: relative;
        transform: translateY(20px);
        transition: transform 0.25s ease;
      }

      .modal-overlay.active .modal-card {
        transform: translateY(0);
      }

      .modal-close {
        position: absolute;
        top: 18px;
        right: 22px;
        background: #f1f4f9;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        font-size: 1.3rem;
        cursor: pointer;
        color: #475569;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-close:hover {
        background: #e2e8f0;
      }

      .detail-header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 28px;
      }

      .detail-avatar {
        width: 75px;
        height: 75px;
        border-radius: 24px;
        background: #e0e7ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        font-weight: 800;
        color: #4338ca;
        text-transform: uppercase;
      }

      .detail-name {
        font-size: 1.8rem;
        font-weight: 800;
      }

      .detail-email {
        color: #64748b;
        font-size: 1rem;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
        margin: 24px 0 18px;
      }

      .detail-item {
        background: #f8fafc;
        border-radius: 18px;
        padding: 16px 18px;
      }

      .detail-item label {
        font-size: 0.8rem;
        color: #64748b;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        display: block;
        margin-bottom: 6px;
      }

      .detail-item .value {
        font-weight: 800;
        font-size: 1.3rem;
        color: #0f172a;
      }

      .full-width {
        grid-column: span 2;
      }

      hr {
        border: 0.5px solid #e9eef3;
        margin: 12px 0 16px;
      }

      /* =========================
         RESPONSIVE
      ========================== */

      @media (max-width: 992px) {
        .main {
          margin-left: 0;
          width: 100%;
        }

        .content {
          padding: 18px;
        }
      }

      @media (max-width: 768px) {
        .table-header {
          flex-direction: column;
          align-items: stretch;
        }

        .search-box {
          width: 100%;
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }

        .full-width {
          grid-column: span 1;
        }
      }
    </style>
  </head>

  <body>
    <!-- Sidebar -->
    <div id="sidebar"></div>

    <div class="main">
      <!-- Header -->
      <div id="header"></div>

      <div class="content">
        <!-- STUDENT PERFORMANCE LIST (ONLY TABLE) -->
        <div class="table-card">
          <div class="table-header">
            <div class="card-title">Student Performance List</div>
            <div class="search-box">
              <i class="ri-search-line"></i>
              <input type="text" id="searchInput" placeholder="Search student..." autocomplete="off" />
            </div>
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Student Name</th>
                  <th>Email</th>
                  <th>Quizzes Taken</th>
                  <th>Average Score</th>
                  <th>Pass Rate</th>
                  <th>Last Activity</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <!-- Dynamic rows injected via JavaScript -->
              </tbody>
            </table>
          </div>

          <div class="pagination" id="paginationContainer">
            <!-- Pagination buttons will be generated -->
          </div>
        </div>
      </div>
    </div>

    <!-- STUDENT DETAIL MODAL -->
    <div class="modal-overlay" id="studentModal">
      <div class="modal-card">
        <button class="modal-close" id="closeModalBtn"><i class="ri-close-line"></i></button>
        <div id="modalContent">
          <!-- Filled dynamically -->
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../assets/scripts/layout.js"></script>

    <script>
      // LOAD SIDEBAR
      fetch("../assets/components/sidebar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebar").innerHTML = data;

          const activeLink = document.querySelector(
            '.nav-link[href="dashboard.html"]'
          );
          if (activeLink) {
            activeLink.classList.add("active");
          }
        });

      // LOAD HEADER
      fetch("../assets/components/header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;

          const menuToggle = document.querySelector("#menuToggle");
          if (menuToggle) {
            menuToggle.addEventListener("click", () => {
              const sidebar = document.querySelector(".sidebar");
              if (sidebar) {
                sidebar.classList.toggle("show-sidebar");
              }
            });
          }
        });

      // --------------------------------------------------------------
      // STUDENT DATA (Full details for modal)
      // --------------------------------------------------------------
      const students = [
        {
          id: 1,
          firstName: "John",
          lastName: "Dela Cruz",
          email: "john.delacruz@email.com",
          quizzesTaken: 32,
          averageScore: 94.2,
          passRate: 100,
          lastActivity: "May 29, 2026",
          status: "Active",
          phone: "+63 912 345 6789",
          enrolledCourse: "Professional Education",
          address: "Quezon City, Philippines"
        },
        {
          id: 2,
          firstName: "Maria",
          lastName: "Santos",
          email: "maria.santos@email.com",
          quizzesTaken: 28,
          averageScore: 88.5,
          passRate: 96.4,
          lastActivity: "May 30, 2026",
          status: "Active",
          phone: "+63 917 123 4567",
          enrolledCourse: "General Education",
          address: "Manila, Philippines"
        },
        {
          id: 3,
          firstName: "Luis",
          lastName: "Reyes",
          email: "luis.reyes@email.com",
          quizzesTaken: 15,
          averageScore: 72.3,
          passRate: 73.3,
          lastActivity: "May 28, 2026",
          status: "Inactive",
          phone: "+63 928 555 1212",
          enrolledCourse: "Major Specialization",
          address: "Cebu City, Philippines"
        },
        {
          id: 4,
          firstName: "Elena",
          lastName: "Mercado",
          email: "elena.m@email.com",
          quizzesTaken: 41,
          averageScore: 91.7,
          passRate: 97.6,
          lastActivity: "May 31, 2026",
          status: "Active",
          phone: "+63 939 222 3344",
          enrolledCourse: "Professional Education",
          address: "Davao City, Philippines"
        },
        {
          id: 5,
          firstName: "Carlos",
          lastName: "Tan",
          email: "carlos.tan@email.com",
          quizzesTaken: 20,
          averageScore: 65.8,
          passRate: 60.0,
          lastActivity: "May 20, 2026",
          status: "Inactive",
          phone: "+63 908 111 5555",
          enrolledCourse: "General Education",
          address: "Makati, Philippines"
        },
        {
          id: 6,
          firstName: "Sofia",
          lastName: "Cruz",
          email: "sofia.cruz@email.com",
          quizzesTaken: 37,
          averageScore: 96.1,
          passRate: 100,
          lastActivity: "June 1, 2026",
          status: "Active",
          phone: "+63 956 789 0123",
          enrolledCourse: "Major Specialization",
          address: "Pasig, Philippines"
        }
      ];

      // DOM elements
      const tableBody = document.getElementById('tableBody');
      const searchInput = document.getElementById('searchInput');
      const paginationContainer = document.getElementById('paginationContainer');
      const modalOverlay = document.getElementById('studentModal');
      const modalContent = document.getElementById('modalContent');
      const closeModalBtn = document.getElementById('closeModalBtn');

      // State
      const rowsPerPage = 4;
      let currentPage = 1;
      let filteredStudents = [...students];

      // --------------------------------------------------------------
      // RENDER TABLE
      // --------------------------------------------------------------
      function renderTable() {
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageStudents = filteredStudents.slice(start, end);

        if (pageStudents.length === 0 && currentPage > 1) {
          currentPage = 1;
          renderTable();
          return;
        }

        tableBody.innerHTML = '';

        pageStudents.forEach((s) => {
          const globalIndex = students.indexOf(s) + 1;
          const row = document.createElement('tr');
          row.setAttribute('data-id', s.id);

          const scoreClass = s.averageScore >= 85 ? 'green-text' : (s.averageScore >= 70 ? '' : 'red-text');

          row.innerHTML = `
            <td>${globalIndex}</td>
            <td>
              <div class="student">
                <div class="avatar">${s.firstName.charAt(0)}</div>
                ${s.firstName} ${s.lastName}
              </div>
            </td>
            <td>${s.email}</td>
            <td>${s.quizzesTaken}</td>
            <td class="${scoreClass}">${s.averageScore.toFixed(1)}%</td>
            <td class="${s.passRate >= 85 ? 'green-text' : ''}">${s.passRate.toFixed(1)}%</td>
            <td>${s.lastActivity}</td>
            <td>
              <span class="badge ${s.status === 'Active' ? 'active' : 'inactive'}">${s.status}</span>
            </td>
            <td>
              <div class="action-btns">
                <button class="icon-btn view-btn" data-id="${s.id}" title="View details">
                  <i class="ri-eye-line"></i>
                </button>
                <button class="icon-btn" title="More">
                  <i class="ri-more-2-fill"></i>
                </button>
              </div>
            </td>
          `;

          // Row click opens modal (but not when clicking action buttons)
          row.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;
            openStudentDetail(s.id);
          });

          tableBody.appendChild(row);
        });

        // Attach view button listeners
        document.querySelectorAll('.view-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const studentId = parseInt(btn.getAttribute('data-id'), 10);
            openStudentDetail(studentId);
          });
        });

        renderPagination();
      }

      // --------------------------------------------------------------
      // PAGINATION
      // --------------------------------------------------------------
      function renderPagination() {
        const totalPages = Math.ceil(filteredStudents.length / rowsPerPage) || 1;
        paginationContainer.innerHTML = '';

        // Previous button
        const prevBtn = document.createElement('button');
        prevBtn.className = 'page-btn';
        prevBtn.innerHTML = '<i class="ri-arrow-left-s-line"></i>';
        prevBtn.disabled = currentPage === 1;
        prevBtn.addEventListener('click', () => {
          if (currentPage > 1) {
            currentPage--;
            renderTable();
          }
        });
        paginationContainer.appendChild(prevBtn);

        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
          const pageBtn = document.createElement('button');
          pageBtn.className = `page-btn ${i === currentPage ? 'active-page' : ''}`;
          pageBtn.textContent = i;
          pageBtn.addEventListener('click', () => {
            if (currentPage !== i) {
              currentPage = i;
              renderTable();
            }
          });
          paginationContainer.appendChild(pageBtn);
        }

        // Next button
        const nextBtn = document.createElement('button');
        nextBtn.className = 'page-btn';
        nextBtn.innerHTML = '<i class="ri-arrow-right-s-line"></i>';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.addEventListener('click', () => {
          if (currentPage < totalPages) {
            currentPage++;
            renderTable();
          }
        });
        paginationContainer.appendChild(nextBtn);
      }

      // --------------------------------------------------------------
      // SEARCH FILTER
      // --------------------------------------------------------------
      function filterStudents(searchTerm) {
        const term = searchTerm.toLowerCase().trim();
        if (term === '') {
          filteredStudents = [...students];
        } else {
          filteredStudents = students.filter(s =>
            `${s.firstName} ${s.lastName}`.toLowerCase().includes(term) ||
            s.email.toLowerCase().includes(term)
          );
        }
        currentPage = 1;
        renderTable();
      }

      searchInput.addEventListener('input', (e) => {
        filterStudents(e.target.value);
      });

      // --------------------------------------------------------------
      // MODAL: OPEN STUDENT DETAIL
      // --------------------------------------------------------------
      function openStudentDetail(studentId) {
        const student = students.find(s => s.id === studentId);
        if (!student) return;

        const statusClass = student.status === 'Active' ? 'active' : 'inactive';
        const scoreColor = student.averageScore >= 85 ? '#16a34a' : (student.averageScore >= 70 ? '#b45309' : '#b91c1c');

        modalContent.innerHTML = `
          <div class="detail-header">
            <div class="detail-avatar">${student.firstName.charAt(0)}</div>
            <div>
              <div class="detail-name">${student.firstName} ${student.lastName}</div>
              <div class="detail-email"><i class="ri-mail-line"></i> ${student.email}</div>
            </div>
          </div>
          <div class="detail-grid">
            <div class="detail-item">
              <label>Quizzes Taken</label>
              <div class="value">${student.quizzesTaken}</div>
            </div>
            <div class="detail-item">
              <label>Average Score</label>
              <div class="value" style="color:${scoreColor}">${student.averageScore.toFixed(1)}%</div>
            </div>
            <div class="detail-item">
              <label>Pass Rate</label>
              <div class="value">${student.passRate.toFixed(1)}%</div>
            </div>
            <div class="detail-item">
              <label>Status</label>
              <div class="value"><span class="badge ${statusClass}" style="font-size:0.9rem;">${student.status}</span></div>
            </div>
            <div class="detail-item full-width">
              <label>Last Activity</label>
              <div class="value" style="font-size:1.1rem;">${student.lastActivity}</div>
            </div>
            <div class="detail-item">
              <label>Phone</label>
              <div class="value" style="font-size:1rem;">${student.phone || '—'}</div>
            </div>
            <div class="detail-item">
              <label>Enrolled Course</label>
              <div class="value" style="font-size:1rem;">${student.enrolledCourse || '—'}</div>
            </div>
            <div class="detail-item full-width">
              <label>Address</label>
              <div class="value" style="font-size:1rem;">${student.address || '—'}</div>
            </div>
          </div>
          <hr />
          <div style="display:flex; justify-content:flex-end; gap:12px;">
            <button class="icon-btn" style="width:auto; padding:0 16px;" id="modalEditBtn"><i class="ri-pencil-line"></i> Edit</button>
            <button class="icon-btn" style="width:auto; padding:0 16px; background:#f1f5f9;"><i class="ri-download-line"></i> Report</button>
          </div>
        `;

        modalOverlay.classList.add('active');

        document.getElementById('modalEditBtn')?.addEventListener('click', () => {
          alert(`Edit details for ${student.firstName} ${student.lastName} (demo).`);
        });
      }

      function closeModal() {
        modalOverlay.classList.remove('active');
      }

      // Close modal events
      closeModalBtn.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
          closeModal();
        }
      });

      // --------------------------------------------------------------
      // INITIAL RENDER
      // --------------------------------------------------------------
      filteredStudents = [...students];
      renderTable();
    </script>
  </body>
</html>
